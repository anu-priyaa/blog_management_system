<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style>
    body{
    background-color: rgb(146,146,83);
}

.password-card{
    background-color: rgba(230,230,183,0.95);
    width: 450px;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.25);
}

.page-title{
    text-align: center;
    color: rgb(90,90,30);
    font-weight: bold;
    margin-bottom: 25px;
}

.form-label{
    color: rgb(90,90,30);
    font-weight: 600;
}

.form-control{
    border-radius: 10px;
    padding: 10px;
}

.form-control:focus{
    border-color: rgb(147,147,61);
    box-shadow: 0px 0px 8px rgba(147,147,61,0.4);
}

.submit-btn{
    background-color: rgb(90,90,30);
    color: white;
    border: none;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    font-weight: bold;
    transition: 0.3s;
}

.submit-btn:hover{
    background-color: rgb(70,70,20);
    color: white;
    transform: translateY(-2px);
}


    
</style>
<body class="d-flex justify-content-center align-items-center min-vh-100">

<div>

    <div class="password-card">

        <h2 class="page-title">
            🔒 Change Password
        </h2>

        <form action="/blogApp/post_changepassword/" method="post">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Old Password
                </label>

                <input type="password"
                       name="oldpassword"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    New Password
                </label>

                <input type="password"
                       name="newpassword"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Confirm Password
                </label>

                <input type="password"
                       name="confirmpassword"
                       class="form-control"
                       required>
            </div>

            <button type="submit"
                    class="btn submit-btn">
                CHANGE PASSWORD
            </button>

        </form>

    </div>

</div>

</body>
</html>
