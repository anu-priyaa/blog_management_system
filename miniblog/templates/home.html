<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Management System</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
</head>

<style>

body{
    background-image: url("/media/bgdimg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.hero-card{
    background-color: rgba(230,230,183,0.97);
    width: 700px;
    padding: 50px;
    border-radius: 30px;
    text-align: center;

    backdrop-filter: blur(8px);

    border: 2px solid rgba(255,255,255,0.4);

    box-shadow:
        0px 15px 35px rgba(0,0,0,0.35),
        0px 0px 20px rgba(255,255,255,0.15);
}

.title{
    font-family: 'Playfair Display', serif;
    color: rgb(90,90,30);
    font-size: 54px;
    font-weight: 800;
    line-height: 1.1;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.15);
}
.subtitle{
    color: rgb(70,70,20);
    font-size: 20px;
    line-height: 1.6;
    margin-top: 20px;
    margin-bottom: 40px;
}

.login-btn{
    background-color: rgb(90,90,30);
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 10px;
    text-decoration: none;
    margin-right: 15px;
    font-weight: bold;
}

.register-btn{
    background-color: #198754;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}


.login-btn:hover,
.register-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0px 5px 12px rgba(0,0,0,0.2);
}
</style>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="hero-card">

        <h1 class="title">
            📖 Blog Management System
        </h1>

        <p class="subtitle">
            Create blogs, manage profiles, comment on posts,
            and explore content shared by other users.
        </p>

        <a href="/blogApp/get_login/"
           class="login-btn">
           Login
        </a>

        <a href="/blogApp/get_register/"
           class="register-btn">
           Register
        </a>

    </div>

</body>
</html>
