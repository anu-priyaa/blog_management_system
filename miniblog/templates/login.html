<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<style>
    body{
    background-image: url("/media/loginbgd.jpeg");
    background-color: rgb(146, 146, 83);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.logincard{
    background-color: rgba(230,230,183,0.95);
    width: 450px;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.25);
}

.login-title{
    text-align: center;
    color: rgb(90,90,30);
    font-weight: bold;
    margin-bottom: 30px;
}

.form-label{
    color: rgb(90,90,30);
    font-weight: 600;
}

.form-control{
    border-radius: 10px;
    padding: 10px;
}

.form-control:focus{
    border-color: rgb(147,147,61);
    box-shadow: 0px 0px 8px rgba(147,147,61,0.4);
}

.login-btn{
    background-color: rgb(90,90,30);
    color: white;
    border: none;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    font-weight: bold;
    transition: 0.3s;
}

.login-btn:hover{
    background-color: rgb(70,70,20);
    color: white;
    transform: translateY(-2px);
}

.register-link{
    text-align: center;
    margin-top: 20px;
}

.register-link a{
    color: rgb(90,90,30);
    font-weight: bold;
    text-decoration: none;
}

.register-link a:hover{
    text-decoration: underline;
}
</style>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="logincard">

        <h2 class="login-title">
            🔐 Login
        </h2>

        <form action="/blogApp/post_login/" method="post">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Username / Email
                </label>

                <input type="text"
                       name="email"
                       class="form-control"
                       placeholder="Enter username or email"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter password"
                       required>
            </div>

            <button type="submit"
                    class="btn login-btn">
                LOGIN
            </button>

            <div class="register-link">
                Don't have an account?
                <a href="/blogApp/get_register/">
                    Register Here
                </a>
            </div>

        </form>

    </div>

</body>
</html>
