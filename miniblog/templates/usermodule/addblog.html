<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style>
    body{
    background-color: rgb(225,225,183);
}

.blog-card{
    width: 650px;
    margin: auto;
    margin-top: 20px;
    background-color: rgb(187,187,128);
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
}

h2{
    color: rgb(90,90,30);
    text-align: center;
    margin-bottom: 30px;
    font-weight: bold;
}

.form-label{
    color: rgb(90,90,30);
    font-weight: bold;
}

.form-control{
    border-radius: 10px;
    border: 1px solid rgb(170,170,100);
}

.form-control:focus{
    border-color: rgb(120,120,50);
    box-shadow: 0 0 5px rgba(120,120,50,0.5);
}

.create-btn{
    background-color: rgb(120, 120, 45);
    border: none;
    font-weight: bold;
    padding: 10px;
    border-radius: 10px;
}

.create-btn:hover{
    background-color: rgb(70,70,20);
}

.back-btn{
    margin-top: 15px;
}
</style>

<body>

<div class="container mt-4">

    <a href="/blogApp/userhome/"
       class="btn btn-dark mb-3">
       ← Back to Home
    </a>

</div>

<div class="blog-card">

    <h2>Create Blog</h2>

    <form action="/blogApp/post_addblog/"
          method="post"
          enctype="multipart/form-data">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Blog Title</label>
            <input type="text"
                   name="title"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Blog Content</label>
            <textarea name="content"
                      class="form-control"
                      rows="6"
                      required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Blog Image</label>
            <input type="file"
                   name="image"
                   class="form-control"
                   required>
        </div>

        <button type="submit"
        class="btn create-btn w-100">
    Create Blog
</button>

    </form>

</div>

</body>
</html>
