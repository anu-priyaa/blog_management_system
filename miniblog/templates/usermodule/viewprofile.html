<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style>
    body{
    background-color: rgb(225,225,183);
}

.profile-card{
    background-color: rgba(230,230,183,0.95);
    width: 420px;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
}

.profile-img{
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid rgb(153,153,66);
    margin-bottom: 20px;
}

.profile-title{
    color: rgb(90,90,30);
    font-weight: bold;
    margin-bottom: 25px;
}

.profile-info{
    color: rgb(70,70,20);
    text-align: left;
    margin-bottom: 10px;
}

.profile-info span{
    font-weight: bold;
}

.button-edit,
.button-home{
    background-color: rgb(90,90,30);
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 10px;
    display: inline-block;
    margin-top: 15px;
    font-weight: bold;
    transition: 0.3s;
}

.button-edit:hover,
.button-home:hover{
    background-color: rgb(70,70,20);
    color: white;
    transform: translateY(-2px);
}

.button-home{
    margin-left: 10px;
}
</style>
<body class="d-flex justify-content-center align-items-center vh-100">

        <div class="profile-card">

    <h2 class="profile-title">
        👤 My Profile
    </h2>

    <img src="{{data.biopic}}" class="profile-img">

    <h5 class="profile-info">
        <span>Name:</span> {{data.fullname}}
    </h5>

    <h5 class="profile-info">
        <span>Email:</span> {{data.email}}
    </h5>

    <h5 class="profile-info">
        <span>Phone:</span> {{data.phone}}
    </h5>

    <a href="/blogApp/get_editprofile/"
       class="button-edit">
       ✏ Edit Profile
    </a>

    <a href="/blogApp/userhome/"
       class="button-home">
       🏠 Home
    </a>

</div>

</body>
</html>
