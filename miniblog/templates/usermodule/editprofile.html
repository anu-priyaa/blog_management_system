<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style>
    body{
    background-color: rgb(225,225,183);
}

.edit-card{
    background-color: rgba(230,230,183,0.95);
    width: 450px;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.edit-card:hover{
    transform: translateY(-5px);
}

.page-title{
    text-align: center;
    color: rgb(90,90,30);
    font-weight: bold;
    margin-bottom: 25px;
}

.profile-img{
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid rgb(153,153,66);
    display: block;
    margin: 0 auto 25px;
}

.form-label{
    color: rgb(90,90,30);
    font-weight: 600;
}

.form-control{
    border-radius: 10px;
    padding: 10px;
}

.form-control:focus{
    border-color: rgb(147,147,61);
    box-shadow: 0px 0px 8px rgba(147,147,61,0.4);
}

.button-update{
    background-color: rgb(90,90,30);
    color: white;
    border: none;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    font-weight: bold;
    transition: 0.3s;
}

.button-update:hover{
    background-color: rgb(70,70,20);
    color: white;
    transform: translateY(-2px);
}

.back-btn{
    background-color: #212529;
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 500;
    display: inline-block;
    margin-bottom: 20px;
}

.back-btn:hover{
    color: white;
    background-color: #1c1f23;
}
</style>

<body class="d-flex justify-content-center align-items-center min-vh-100">

<form action="/blogApp/post_editprofile/"
      method="post"
      enctype="multipart/form-data">

    {% csrf_token %}

    <div class="edit-card">

        <a href="/blogApp/viewprofile/"
           class="back-btn">
           ← Back
        </a>

        <h2 class="page-title">
            ✏ Edit Profile
        </h2>

        <img src="{{data.biopic}}"
             class="profile-img">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text"
                   name="fullname"
                   value="{{data.fullname}}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text"
                   name="phone"
                   value="{{data.phone}}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">New Profile Picture</label>
            <input type="file"
                   name="biopic"
                   class="form-control">
        </div>

        <button class="button-update">
            UPDATE PROFILE
        </button>

    </div>

</form>

</body>
</html>
