<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style>
    body{
        background-color: rgb(225,225,183);
    }

    .blog-card{
        background-color: rgb(187,187,128);
        border-radius: 15px;
        padding: 20px;
    }
</style>

<body>

<div class="container mt-5">

    <a href="/blogApp/view_allblogs/"
       class="btn btn-dark mb-3">
       ← Back
    </a>

    <div class="blog-card">

        <img src="{{blog.image}}"
             class="img-fluid mb-3">

        <h2>{{blog.title}}</h2>

        <p>{{blog.content}}</p>

        <hr>

        <h4>Add Comment</h4>

        <form action="/blogApp/add_comment/{{blog.id}}/"
              method="post">

            {% csrf_token %}

            <textarea
                name="comment"
                class="form-control"
                rows="3"
                required></textarea>

            <br>

            <button class="btn btn-success">
                Post Comment
            </button>

        </form>

        <hr>

        <h4>Comments</h4>

        {% for i in comments %}

            <div class="card p-3 mb-2">

                <strong>
                    {{i.USER.fullname}}
                </strong>

                <p class="mb-0">
                    {{i.comment}}
                </p>

            </div>

        {% empty %}

            <p>No comments yet.</p>

        {% endfor %}

    </div>

</div>

</body>
</html>
