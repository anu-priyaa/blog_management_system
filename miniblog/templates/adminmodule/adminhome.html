<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<style>
    body{
    background-color: rgb(225,225,183);
}

.title{
    text-align: center;
    color: rgb(90,90,30);
    font-weight: bold;
    margin-bottom: 50px;
}

.logout-btn{
    position: absolute;
    top: 20px;
    right: 30px;
}

.card-box{
    width: 220px;
    height: 180px;
    background-color: rgb(187,187,128);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0px 6px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card-box:hover{
    transform: translateY(-8px);
}

.card-link{
    text-decoration: none;
    color: rgb(90,90,30);
    font-weight: bold;
    font-size: 22px;
}

.row{
    row-gap: 40px;
}
</style>

<body>
    <a href="/blogApp/logout_user/"
   class="btn btn-danger logout-btn"
   onclick="return confirm('Are you sure you want to logout?')">
   Logout
</a>

    <h2 class="title">Welcome to Admin Home</h2>

    <div class="container mt-5">
        <div class="row justify-content-center gx-5 gy-5">

            <div class="col-md-3">
                <div class="card-box">
                    <a href="/blogApp/viewdata/" class="card-link">
                        👥 <br><br> View All Users
                    </a>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card-box">
                    <a href="/blogApp/get_changepassword/" class="card-link">
                        🔒 <br><br> Change Password
                    </a>
                </div>
            </div>

            <div class="col-md-3">
    <div class="card-box">
        <a href="/blogApp/viewallblogs_admin/" class="card-link">
            ✅ <br><br> Verify Blogs
        </a>
    </div>
</div>

        </div>
    </div>

</body>
</html>
