<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Blogs</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<style>
    body{
        background-color: rgb(225,225,183);
    }

    .page-title{
        color: rgb(90,90,30);
        font-weight: bold;
    }

    .blog-card{
        border: none;
        border-radius: 15px;
        overflow: hidden;
        background-color: rgb(187,187,128);
        box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        transition: 0.3s;
    }

    .blog-card:hover{
        transform: translateY(-5px);
    }

    .blog-img{
        height: 220px;
        width: 100%;
        object-fit: cover;
    }

    .blog-title{
        color: rgb(90,90,30);
        font-weight: bold;
    }

    .status{
        font-weight: bold;
    }
</style>

<body>

<div class="container mt-5">

    <div class="mb-4">
        <a href="/blogApp/adminhome/"
           class="btn btn-dark">
           ← Back to Home
        </a>
    </div>

    <h2 class="text-center page-title mb-5">
        Verify Blogs
    </h2>

    <div class="row">

        {% for i in blogs %}

        <div class="col-md-4 mb-4">

            <div class="card blog-card">

                <img src="{{i.image}}" class="blog-img">

                <div class="card-body">

                    <h5 class="blog-title">
                        {{i.title}}
                    </h5>

                    <small class="text-dark">
                        By {{i.USER.fullname}}
                    </small>

                    <p class="mt-2">
                        <strong>Status:</strong> {{i.status}}
                    </p>

                    <p class="mt-2">
                        {{i.content}}
                    </p>

                    <div class="text-center mt-3">

                        <div class="d-flex justify-content-between mt-3">

                            <a href="/blogApp/approve_blog/{{i.id}}/"
                               class="btn btn-success">
                               Approve
                            </a>

                            <a href="/blogApp/reject_blog/{{i.id}}/"
                               class="btn btn-danger">
                               Reject
                            </a>

                            <a href="/blogApp/delete_blog_admin/{{i.id}}/"
                               class="btn btn-danger"
                               onclick="return confirm('Delete this blog?')">
                               Delete
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="text-center">
            <h4>No Blogs Added Yet</h4>
        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
