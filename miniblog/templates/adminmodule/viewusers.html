<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data</title>
      <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        $(document).ready(function () {

            $('#dataTable').DataTable({
                paging: true,
                searching: true,
                ordering: true,
                info: true,
                lengthChange: false
            });

        });
    </script>

</head>

<style>
body{
    background-color: rgb(225,225,183);
}

.page-title{
    color: rgb(90,90,30);
    font-weight: bold;
    text-align: center;
    margin-bottom: 30px;
    font-size: 35px;
}

.table-container{
    background-color: rgba(255,255,255,0.95);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
}

.profile-img{
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid rgb(187,187,128);
}

.block-btn{
    background-color: #dc3545;
    color: white;
    text-decoration: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s;
}

.block-btn:hover{
    background-color: #bb2d3b;
    color: white;
}

.unblock-btn{
    background-color: #198754;
    color: white;
    text-decoration: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s;
}

.unblock-btn:hover{
    background-color: #157347;
    color: white;
}

.back-btn{
    background-color: #212529;
    color: white !important;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 25px;
    transition: 0.3s;
}

.back-btn:hover{
    background-color: #111418;
    color: white;
    transform: translateY(-2px);
}

table.dataTable thead{
    background-color: rgb(90,90,30);
    color: white;
}

table.dataTable tbody tr:hover{
    background-color: rgba(225,225,183,0.4);
}

.dataTables_filter input{
    border-radius: 8px;
    padding: 5px 10px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
    background: rgb(90,90,30);
    color: white;
    border: none ;
}

.dataTables_wrapper .dataTables_paginate .paginate_button:hover{
    background: rgb(70,70,20);
    color: white;
}
</style>

<body>

<div class="container mt-5">

    <a href="/blogApp/adminhome/"
   class="btn back-btn">
   ← Back to Home
</a>

    <h2 class="page-title">
        👥 View All Users
    </h2>

    <div class="table-container">

        <table id="dataTable" class="table table-bordered table-hover">

            <thead class="table-dark">
                <tr>
                    <th>Sl No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Biopic</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                {% for i in data %}

                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{i.fullname}}</td>
                    <td>{{i.email}}</td>
                    <td>{{i.phone}}</td>

                    <td>
                        <img src="{{i.biopic}}"
                             class="profile-img">
                    </td>

                    <td>

                        {% if i.AUTHUSER.is_active %}

                        <a href="/blogApp/block_user/{{i.id}}/"
                           class="block-btn"
                           onclick="return confirm('Block this user?')">
                           Block
                        </a>

                        {% else %}

                        <a href="/blogApp/unblock_user/{{i.id}}/"
                           class="unblock-btn"
                           onclick="return confirm('Unblock this user?')">
                           Unblock
                        </a>

                        {% endif %}

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
